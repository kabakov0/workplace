<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타이머</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0a84ff;
      --danger: #ff453a;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --fg: #f5f5f7;
        --muted: #98989d;
        --accent: #0a84ff;
        --danger: #ff453a;
        --card: #1c1c1e;
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #98989d;
      --accent: #0a84ff;
      --danger: #ff453a;
      --card: #1c1c1e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .display {
      font-size: clamp(3rem, 18vw, 5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 8px 0 24px;
    }

    .inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .inputs input {
      width: 80px;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      border: 1px solid var(--muted);
      border-radius: 12px;
      background: transparent;
      color: var(--fg);
    }

    .inputs span { color: var(--muted); }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      min-width: 96px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button.secondary { background: var(--muted); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .done .display { color: var(--danger); }

    .status {
      min-height: 1.4em;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="display" id="display" role="timer">00:00</div>

    <div class="inputs">
      <input id="minutes" type="number" min="0" max="999" value="5" aria-label="분">
      <span>:</span>
      <input id="seconds" type="number" min="0" max="59" value="0" aria-label="초">
    </div>

    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn" class="secondary">초기화</button>
    </div>

    <div class="status" id="status" role="status"></div>
  </main>

  <script>
    const display = document.getElementById("display");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusEl = document.getElementById("status");
    const app = document.getElementById("app");

    let total = 0;       // 설정된 전체 시간 (초)
    let remaining = 0;   // 남은 시간 (초)
    let endAt = null;    // 종료 시각 (ms), 실행 중일 때만 사용
    let timerId = null;

    function readInput() {
      const m = Math.max(0, parseInt(minutesInput.value, 10) || 0);
      const s = Math.min(59, Math.max(0, parseInt(secondsInput.value, 10) || 0));
      return m * 60 + s;
    }

    function format(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function render() {
      display.textContent = format(remaining);
      document.title = endAt ? `${format(remaining)} - 타이머` : "타이머";
    }

    function setRunning(running) {
      startBtn.textContent = running ? "일시정지" : (remaining < total ? "재개" : "시작");
      minutesInput.disabled = running;
      secondsInput.disabled = running;
    }

    function tick() {
      // 탭이 백그라운드여도 정확하도록 실제 시각 기준으로 계산
      remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      render();
      if (remaining === 0) {
        finish();
      }
    }

    function start() {
      if (remaining === 0) {
        total = readInput();
        remaining = total;
        if (remaining === 0) {
          statusEl.textContent = "시간을 입력해 주세요.";
          return;
        }
      }
      endAt = Date.now() + remaining * 1000;
      timerId = setInterval(tick, 250);
      app.classList.remove("done");
      statusEl.textContent = "";
      setRunning(true);
      render();
    }

    function pause() {
      clearInterval(timerId);
      timerId = null;
      endAt = null;
      setRunning(false);
    }

    function finish() {
      pause();
      remaining = 0;
      render();
      app.classList.add("done");
      statusEl.textContent = "⏰ 시간이 끝났습니다!";
      startBtn.textContent = "시작";
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {
        // 사운드를 지원하지 않는 환경에서는 무시
      }
    }

    function reset() {
      pause();
      total = readInput();
      remaining = total;
      app.classList.remove("done");
      statusEl.textContent = "";
      setRunning(false);
      render();
    }

    startBtn.addEventListener("click", () => {
      if (timerId) pause();
      else start();
    });

    resetBtn.addEventListener("click", reset);

    minutesInput.addEventListener("change", () => { if (!timerId) reset(); });
    secondsInput.addEventListener("change", () => { if (!timerId) reset(); });

    document.addEventListener("keydown", (e) => {
      // 버튼과 입력창에서는 브라우저 기본 동작에 맡겨 한 번만 토글되도록 함
      if (e.code === "Space" && !["INPUT", "BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        startBtn.click();
      }
    });

    reset();
  </script>
</body>
</html>
